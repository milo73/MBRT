<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; font-family: "Lato", Helvetica, Arial, sans-serif; color: #1A1A1A; }
    a { color: #B40066; text-decoration: none; }
    a:hover { color: #E3027F; }
  </style>
</helmet>

<div style="width: 560px; min-height: 640px; display: flex; flex-direction: column; background: #FFFFFF;">

  <div style="padding: 20px 24px; border-bottom: 1px solid #E1E1E1; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #5A5A5A;">Richting C · schets</span>
    <strong style="font-size: 20px; font-weight: 900; letter-spacing: -0.01em;">Contrastblok</strong>
    <span style="font-size: 13px; color: #5A5A5A;">Magenta kopblok, inkt-zwarte kaarten, cijfers als affiche. Maximaal contrast.</span>
  </div>

  <!-- Schets -->
  <div style="flex-grow: 1; background: #FFFFFF; display: flex; flex-direction: column;">

    <div style="background: #E3027F; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 90px; height: 10px; background: #FFFFFF; opacity: .7;"></div>
      <div style="width: 260px; height: 26px; background: #FFFFFF;"></div>
      <div style="width: 190px; height: 10px; background: #FFFFFF; opacity: .55;"></div>
    </div>

    <div style="padding: 22px; display: flex; flex-direction: column; gap: 12px;">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div style="background: #1A1A1A; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
          <div style="width: 74px; height: 9px; background: #FFFFFF; opacity: .5;"></div>
          <div style="width: 96px; height: 32px; background: #FFFFFF;"></div>
        </div>
        <div style="background: #1A1A1A; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
          <div style="width: 60px; height: 9px; background: #FFFFFF; opacity: .5;"></div>
          <div style="width: 46px; height: 32px; background: #FFFFFF;"></div>
        </div>
      </div>

      <div style="border: 2px solid #1A1A1A; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
        <div style="width: 120px; height: 11px; background: #1A1A1A;"></div>
        <div style="display: flex; gap: 6px;">
          <div style="flex-grow: 1; height: 40px; border: 2px solid #1A1A1A;"></div>
          <div style="flex-grow: 1; height: 40px; border: 2px solid #1A1A1A;"></div>
          <div style="flex-grow: 1; height: 40px; background: #1A1A1A;"></div>
          <div style="flex-grow: 1; height: 40px; border: 2px solid #1A1A1A;"></div>
          <div style="flex-grow: 1; height: 40px; border: 2px solid #1A1A1A;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #1A1A1A; padding-bottom: 10px;">
          <div style="width: 34px; height: 34px; background: #E3027F;"></div>
          <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
            <div style="width: 58%; height: 11px; background: #1A1A1A;"></div>
            <div style="width: 38%; height: 9px; background: #B0B0B0;"></div>
          </div>
          <div style="width: 42px; height: 18px; background: #1A1A1A;"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #1A1A1A; padding-bottom: 10px;">
          <div style="width: 34px; height: 34px; background: #E3027F;"></div>
          <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
            <div style="width: 48%; height: 11px; background: #1A1A1A;"></div>
            <div style="width: 30%; height: 9px; background: #B0B0B0;"></div>
          </div>
          <div style="width: 42px; height: 18px; background: #1A1A1A;"></div>
        </div>
      </div>

      <div style="height: 52px; background: #1A1A1A; display: flex; align-items: center; justify-content: center;">
        <div style="width: 160px; height: 12px; background: #FFFFFF;"></div>
      </div>

    </div>
  </div>

  <div style="padding: 16px 24px; border-top: 1px solid #E1E1E1; display: flex; flex-direction: column; gap: 3px;">
    <span style="font-size: 13px; font-weight: 900;">Waarom</span>
    <span style="font-size: 13px; color: #5A5A5A;">Zeer herkenbaar en campagne-achtig; werkt sterk op posters en QR-flyers.</span>
    <span style="font-size: 13px; color: #5A5A5A;"><strong style="font-weight: 900; color: #1A1A1A;">Nadeel:</strong> veel visueel gewicht op een scherm waar je acht keer per dag kort komt.</span>
  </div>

</div>
</x-dc>
</body>
</html>
