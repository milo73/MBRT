ca Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">🥗</text><text x="48" y="268" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Voeding</text><text x="24" y="308" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">💬</text><text x="48" y="308" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Motivatie</text><text x="24" y="348" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">👥</text><text x="48" y="348" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Teamvoortgang</text><text x="24" y="388" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">📝</text><text x="48" y="388" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Evaluatie</text><text x="20" y="850" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start">Reset demo-data</text><text x="20" y="874" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#5A5A5A" text-anchor="start">Uitloggen</text><rect x="240" y="0" width="1200" height="900" fill="#FAFAFA"/><text x="280" y="56" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#E3027F" text-anchor="start" letter-spacing="1">HERSTELMOMENTEN</text><text x="280" y="96" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#1A1A1A" text-anchor="start">1 tot 5 minuten voor jezelf</text><text x="280" y="124" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5A5A5A" text-anchor="start">Mentale en fysieke reset. Kies wat past bij dit moment.</text><rect x="1280" y="44" width="120" height="32" fill="#FCE6F2" rx="999" ry="999"/><text x="1340" y="64" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#B40066" text-anchor="middle">Week 3</text><rect x="280" y="168" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="298" y="208" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🌬</text><text x="336" y="204" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Ademhalingsoefening</text><text x="336" y="226" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Twee minuten rustig in- en</text><text x="336" y="244" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">uitademen. Adem laag in je buik.</text><rect x="570" y="186" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="598" y="202" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">2 min</text><rect x="654" y="168" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="672" y="208" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">👀</text><text x="710" y="204" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Schermpauze</text><text x="710" y="226" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Drie minuten weg van het scherm.</text><text x="710" y="244" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Kijk uit het raam.</text><rect x="944" y="186" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="972" y="202" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">3 min</text><rect x="1028" y="168" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="1046" y="208" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">💆</text><text x="1084" y="204" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Nek- en schouderstretch</text><text x="1084" y="226" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Maak rustige rondjes met je</text><text x="1084" y="244" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">schouders.</text><rect x="1318" y="186" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="1346" y="202" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">2 min</text><rect x="280" y="302" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="298" y="342" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🚶</text><text x="336" y="338" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Mini-wandeling</text><text x="336" y="360" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Vijf minuten naar buiten of door de</text><text x="336" y="378" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">gang.</text><rect x="570" y="320" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="598" y="336" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">5 min</text><rect x="654" y="302" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="672" y="342" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🤫</text><text x="710" y="338" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Stiltemoment</text><text x="710" y="360" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Twee minuten niets. Geen scherm,</text><text x="710" y="378" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">geen gesprek.</text><rect x="944" y="320" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="972" y="336" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">2 min</text><rect x="1028" y="302" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="1046" y="342" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🔄</text><text x="1084" y="338" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Reset na overleg</text><text x="1084" y="360" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Drie ademhalingen, even rondkijken,</text><text x="1084" y="378" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">dan pas verder.</text><rect x="1318" y="320" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="1346" y="336" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">3 min</text><rect x="280" y="460" width="1120" height="160" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="300" y="488" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#E3027F" text-anchor="start" letter-spacing="1">KORTE REFLECTIE</text><text x="300" y="520" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A" text-anchor="start">Wat heb je nu nodig om verder te kunnen?</text><rect x="300" y="540" width="760" height="44" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/><text x="316" y="568" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5A5A5A" text-anchor="start">Eén woord is genoeg…</text><rect x="300" y="596" width="192" height="44" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="396" y="624" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Opslaan voor jezelf</text>
</svg>