rif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Toevoegen aan rooster</text><rect x="280" y="380" width="552" height="230" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="300" y="412" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">Micro-pauzes (catalogus)</text><text x="300" y="444" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Schouders losmaken (bewegen, 30s)</text><text x="300" y="466" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Nek- en schouderstretch (bewegen, 1m)</text><text x="300" y="488" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• 20-20-20 oogrust (ogen, 1m)</text><text x="300" y="510" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Rustig ademhalen (ademhaling, 1m)</text><text x="300" y="532" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Loopje naar de printer (bewegen, 2m)</text><text x="300" y="554" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Mini-wandeling (bewegen, 3m)</text><rect x="848" y="380" width="552" height="230" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="868" y="412" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">Maaltijden (catalogus)</text><text x="868" y="444" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Havermout met banaan (ontbijt)</text><text x="868" y="466" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Volkoren wrap met kip (lunch)</text><text x="868" y="488" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Couscous-salade (lunch)</text><text x="868" y="510" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Linzensoep (lunch)</text><text x="868" y="532" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Handje noten (snack)</text><text x="868" y="554" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start">• Water met citroen of munt (drinken)</text><rect x="280" y="630" width="552" height="130" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="300" y="662" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">Evaluatieresultaten</text><text x="300" y="686" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Exporteer geanonimiseerde antwoorden als CSV.</text><rect x="300" y="706" width="144" height="44" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><text x="372" y="734" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Exporteer CSV</text>
