'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5A5A5A" text-anchor="start">30 seconden tot 3 minuten. Even los van het scherm.</text><rect x="1280" y="44" width="120" height="32" fill="#FCE6F2" rx="999" ry="999"/><text x="1340" y="64" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#B40066" text-anchor="middle">Week 3</text><rect x="280" y="160" width="1120" height="96" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="300" y="192" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">Dagdoel</text><text x="300" y="216" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Neem vandaag 3 micro-pauzes.</text><circle cx="1340" cy="208" r="28" fill="#FCE6F2" stroke="#E3027F" stroke-width="6"/><text x="1340" y="213" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">2 / 3</text><rect x="280" y="276" width="1120" height="68" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="300" y="304" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Categorie</text><rect x="300" y="314" width="60" height="30" fill="#E3027F" stroke="#E3027F" stroke-width="1" rx="999" ry="999"/><text x="330" y="333" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Alle</text><rect x="368" y="314" width="80" height="30" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1" rx="999" ry="999"/><text x="408" y="333" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Bewegen</text><rect x="456" y="314" width="104" height="30" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1" rx="999" ry="999"/><text x="508" y="333" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Ontspannen</text><rect x="568" y="314" width="60" height="30" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1" rx="999" ry="999"/><text x="598" y="333" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Ogen</text><rect x="636" y="314" width="80" height="30" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1" rx="999" ry="999"/><text x="676" y="333" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Houding</text><rect x="724" y="314" width="104" height="30" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1" rx="999" ry="999"/><text x="776" y="333" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="middle">Ademhaling</text><rect x="280" y="364" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="298" y="404" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🧘</text><text x="336" y="400" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Schouders losmaken</text><text x="336" y="422" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Sta op en draai 30 seconden je</text><text x="336" y="440" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">schouders rustig rond.</text><rect x="570" y="382" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="598" y="398" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">30 sec</text><rect x="654" y="364" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="672" y="404" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">💪</text><text x="710" y="400" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Nek- en schouderstretch</text><text x="710" y="422" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Leg je oor richting je schouder. 15</text><text x="710" y="440" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">sec per kant.</text><rect x="944" y="382" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="972" y="398" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">1 min</text><rect x="1028" y="364" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="1046" y="404" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">👀</text><text x="1084" y="400" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">20-20-20 oogrust</text><text x="1084" y="422" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Kijk 20 seconden naar iets op 6</text><text x="1084" y="440" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">meter afstand.</text><rect x="1318" y="382" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="1346" y="398" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">1 min</text><rect x="280" y="498" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="298" y="538" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🌬</text><text x="336" y="534" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Rustig ademhalen</text><text x="336" y="556" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Adem 4 sec in, houd 2 sec vast, 6</text><text x="336" y="574" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">sec uit. 6×.</text><rect x="570" y="516" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="598" y="532" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">1 min</text><rect x="654" y="498" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="672" y="538" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🖨</text><text x="710" y="534" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Loopje naar de printer</text><text x="710" y="556" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Sta op en loop rustig naar de</text><text x="710" y="574" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">koffieruimte.</text><rect x="944" y="516" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="972" y="532" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">2 min</text><rect x="1028" y="498" width="360" height="120" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/><text x="1046" y="538" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1A1A1A" text-anchor="start">🪜</text><text x="1084" y="534" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Traplopen</text><text x="1084" y="556" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">Loop één verdieping op en weer</text><text x="1084" y="574" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="start">terug.</text><rect x="1318" y="516" width="56" height="22" fill="#FCE6F2" rx="999" ry="999"/><text x="1346" y="532" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B40066" text-anchor="middle">2 min</text>
