<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; font-family: "Lato", Helvetica, Arial, sans-serif; color: #1A1A1A; }
    a { color: #B40066; text-decoration: none; }
    a:hover { color: #E3027F; }
  </style>
</helmet>

<div style="width: 560px; min-height: 640px; display: flex; flex-direction: column; background: #FFFFFF;">

  <div style="padding: 20px 24px; border-bottom: 1px solid #E1E1E1; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #5A5A5A;">Richting B · schets</span>
    <strong style="font-size: 20px; font-weight: 900; letter-spacing: -0.01em;">Zacht &amp; organisch</strong>
    <span style="font-size: 13px; color: #5A5A5A;">Warme ondergrond, ronde hoeken, groen leidend. Magenta alleen op de hoofdactie.</span>
  </div>

  <!-- Schets -->
  <div style="flex-grow: 1; background: #F7F5F1; padding: 22px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="width: 150px; height: 18px; background: #DEDAD2; border-radius: 9px;"></div>
        <div style="width: 96px; height: 10px; background: #E7E3DC; border-radius: 5px;"></div>
      </div>
      <div style="width: 40px; height: 40px; background: #DEDAD2; border-radius: 20px;"></div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.04);">
      <div style="width: 120px; height: 12px; background: #E7E3DC; border-radius: 6px;"></div>
      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; height: 40px; background: #F2EFEA; border-radius: 20px;"></div>
        <div style="flex-grow: 1; height: 40px; background: #F2EFEA; border-radius: 20px;"></div>
        <div style="flex-grow: 1; height: 40px; background: #2EA86A; border-radius: 20px;"></div>
        <div style="flex-grow: 1; height: 40px; background: #F2EFEA; border-radius: 20px;"></div>
        <div style="flex-grow: 1; height: 40px; background: #F2EFEA; border-radius: 20px;"></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.04);">
        <div style="width: 28px; height: 28px; background: #DCEFE4; border-radius: 14px;"></div>
        <div style="width: 70px; height: 26px; background: #DEDAD2; border-radius: 6px;"></div>
        <div style="height: 6px; background: #EFEBE4; border-radius: 3px;"><div style="width: 70%; height: 6px; background: #2EA86A; border-radius: 3px;"></div></div>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.04);">
        <div style="width: 28px; height: 28px; background: #DCEFE4; border-radius: 14px;"></div>
        <div style="width: 50px; height: 26px; background: #DEDAD2; border-radius: 6px;"></div>
        <div style="height: 6px; background: #EFEBE4; border-radius: 3px;"><div style="width: 100%; height: 6px; background: #2EA86A; border-radius: 3px;"></div></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.04);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; background: #DCEFE4; border-radius: 18px;"></div>
        <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
          <div style="width: 60%; height: 11px; background: #DEDAD2; border-radius: 6px;"></div>
          <div style="width: 40%; height: 9px; background: #EFEBE4; border-radius: 5px;"></div>
        </div>
        <div style="width: 44px; height: 20px; background: #F2EFEA; border-radius: 10px;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; background: #DCEFE4; border-radius: 18px;"></div>
        <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
          <div style="width: 52%; height: 11px; background: #DEDAD2; border-radius: 6px;"></div>
          <div style="width: 34%; height: 9px; background: #EFEBE4; border-radius: 5px;"></div>
        </div>
        <div style="width: 44px; height: 20px; background: #F2EFEA; border-radius: 10px;"></div>
      </div>
    </div>

    <div style="height: 52px; background: #E3027F; border-radius: 26px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 150px; height: 12px; background: #FFFFFF; opacity: .85; border-radius: 6px;"></div>
    </div>

  </div>

  <div style="padding: 16px 24px; border-top: 1px solid #E1E1E1; display: flex; flex-direction: column; gap: 3px;">
    <span style="font-size: 13px; font-weight: 900;">Waarom</span>
    <span style="font-size: 13px; color: #5A5A5A;">Voelt vriendelijk en gezond; ronde vormen halen de klinische scherpte eraf.</span>
    <span style="font-size: 13px; color: #5A5A5A;"><strong style="font-weight: 900; color: #1A1A1A;">Nadeel:</strong> wijkt af van de hoekige Inholland-huisstijl en oogt minder zakelijk.</span>
  </div>

</div>
</x-dc>
</body>
</html>
